<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>TJ Donat Shop - Olmos</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#080812;color:#fff;max-width:520px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:26px;font-weight:800;margin:10px 0 18px}
.card{background:#12121f;border:1px solid #25253d;border-radius:22px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:#222;display:grid;place-items:center;font-weight:800}
.muted{color:#8080a0}
.bal{background:#5136ff;border-radius:26px;padding:20px;color:#fff;margin:16px 0}
.bal .amt{font-size:42px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.game{background:#12121f;border:2px solid #25253d;border-radius:20px;padding:14px;text-align:center;cursor:pointer}
.game.on{border-color:#6366f1;background:#221f4d}
.game .ico{font-size:40px}
.game b{display:block;margin-top:8px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.item{background:#1a1a2c;border:2px solid #25253d;border-radius:16px;padding:14px;text-align:left;cursor:pointer}
.item.on{border-color:#a394ff;background:#221f4d}
.item b{display:block}
.item .pr{color:#a394ff;font-weight:800;margin-top:4px}
.inp{width:100%;background:#080812;border:2px solid #25253d;border-radius:14px;padding:14px;color:#fff;font-size:16px;margin-top:10px}
.btn{width:100%;background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;border:0;border-radius:18px;padding:16px;font-weight:800;font-size:17px;margin-top:16px;cursor:pointer}
.btn.off{opacity:.4;pointer-events:none}
.lbl{font-size:12px;font-weight:800;color:#8080a0;margin:18px 0 8px;letter-spacing:.5px}
nav{position:fixed;left:12px;right:12px;bottom:12px;max-width:496px;margin:0 auto;background:#12121b;border:1px solid #25253d;border-radius:999px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
nav button{padding:12px;border-radius:999px;border:0;background:0;color:#8080a0;font-weight:700}
nav button.on{background:#221f4d;color:#a394ff}
</style>
</head>
<body>
<div id="app"></div>
<nav><button class="on">🎮 Бозиҳо</button><button onclick="Telegram.WebApp.close()">✕ Пӯшидан</button></nav>
<script>
const tg=Telegram.WebApp;tg.expand();tg.ready();
const games=[
{id:'mlbb',name:'Mobile Legends',icon:'🎮',subs:'Olmos',products:[
{id:'86',title:'86 Diamonds',price:12},{id:'172',title:'172 Diamonds',price:23},{id:'257',title:'257 Diamonds',price:34},{id:'344',title:'344 Diamonds',price:45},{id:'514',title:'514 Diamonds',price:66},{id:'706',title:'706 Diamonds',price:88}
]},
{id:'ff',name:'Free Fire',icon:'🔥',subs:'Almaz',products:[
{id:'100',title:'100 Diamonds',price:10},{id:'310',title:'310 Diamonds',price:28},{id:'520',title:'520 Diamonds',price:46},{id:'1060',title:'1060 Diamonds',price:90},{id:'2180',title:'2180 Diamonds',price:175}
]}
];
let S={game:games[0].id,product:null,playerId:''};
function render(){
let g=games.find(x=>x.id===S.game);
let html=`<div class="card row"><div class="avatar">${g.icon}</div><div><b>TJ Donat Shop</b><div class="muted">@tj_donat_shop_bot</div></div></div>
<div class="bal"><div class="muted">Баланси шумо</div><div class="amt">${tg.initDataUnsafe.user?tg.initDataUnsafe.user.first_name:'0'} <span style="font-size:16px">сомонӣ</span></div></div>
<div class="lbl">БОЗИРО ИНТИХОБ КУНЕД</div>
<div class="grid">${games.map(x=>`<button class="game ${S.game===x.id?'on':''}" onclick="S.game='${x.id}';S.product=null;render()"><div class="ico">${x.icon}</div><b>${x.name}</b><div class="muted">${x.subs}</div></button>`).join('')}</div>
<div class="lbl">ID-И БОЗИНГАР</div>
<div class="card"><input class="inp" placeholder="ID-и бозингарро ворид кунед (масалан 12345678)" value="${S.playerId}" oninput="S.playerId=this.value;check()" id="pid"><div class="muted" style="font-size:12px;margin-top:8px">ID-ро дар профили бозӣ пайдо мекунед</div></div>
<div class="lbl">БАСТАРО ИНТИХОБ КУНЕД</div>
<div class="items">${g.products.map(p=>`<button class="item ${S.product===p.id?'on':''}" onclick="S.product='${p.id}';render()"><b>${p.title} 💎</b><div class="pr">${p.price} сомонӣ</div></button>`).join('')}</div>
<button class="btn ${(!S.product||!S.playerId)?'off':''}" onclick="buy()">Харидан — ${S.product?games.find(x=>x.id===S.game).products.find(x=>x.id===S.product).price:0} сомонӣ</button>
`;
document.getElementById('app').innerHTML=html;
}
function check(){render();document.getElementById('pid').focus();}
function buy(){
if(!S.product||!S.playerId){tg.HapticFeedback.notificationOccurred('error');return;}
let g=games.find(x=>x.id===S.game);let p=g.products.find(x=>x.id===S.product);
let data={game:g.name,item:p.title,price:p.price,player_id:S.playerId};
tg.sendData(JSON.stringify(data));
tg.HapticFeedback.notificationOccurred('success');
setTimeout(()=>tg.close(),400);
}
render();
</script>
</body>
</html>
