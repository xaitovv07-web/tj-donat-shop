<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<style>
:root{--bg:#080812;--card:#12121f;--card2:#1a1a2c;--line:#25253d;--text:#fff;--muted:#8080a0;--accent:#6366f1;--accent2:#7c3aed;--pill:#a394ff;--bal:#5136ff;--ok:#34d399;--warn:#f59e0b;--bad:#ff5d6c;--nav:#12121b;--sel:#221f4d}
:root[data-theme=light]{--bg:#f3f3fa;--card:#fff;--card2:#efeff8;--line:#e0e0ee;--text:#14141f;--muted:#6b6b85;--nav:#fff;--sel:#e7e5ff;--pill:#7c6cf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{max-width:520px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
[hidden]{display:none!important}
h1{font-size:26px;margin:6px 0 18px;font-weight:800}
.lbl{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin:22px 4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* head + balance */
.avatar{width:52px;height:52px;border-radius:50%;background:#e6e6ea center/cover;flex:none;display:grid;place-items:center;color:#333;font-weight:800;font-size:20px}
.who b{display:block;font-size:20px;font-weight:800}.who span{color:var(--muted);font-size:15px}
.ibtn{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ibtn svg{width:22px;height:22px}
.bal{background:var(--bal);border-radius:28px;padding:20px 18px 18px;margin:18px 0;color:#fff}
.bal small{opacity:.8;font-size:15px}
.bal .amt{font-size:46px;font-weight:800;line-height:1.1;margin:4px 0 16px}.bal .amt span{font-size:18px;opacity:.85;margin-left:6px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acts button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.09);border-radius:18px;padding:13px 6px 11px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff}
.acts svg{width:24px;height:24px}

/* segmented tabs */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:18px;gap:2px}
.seg button{padding:13px 6px;border-radius:999px;font-weight:700;font-size:16px;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center}
.seg button.on{background:var(--accent);color:#fff}
.seg.big button{font-size:18px}.seg.big button.on{background:var(--pill)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:-4px 0 16px;padding-bottom:4px;scrollbar-width:none}
.chips button{padding:10px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:700;white-space:nowrap}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* games */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px}
.game{text-align:center}
.tile{position:relative;aspect-ratio:1;border-radius:26px;overflow:hidden;display:grid;place-items:center;color:#fff}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .mark{font-weight:900;font-size:24px;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.tile .star{position:absolute;top:0;left:0;width:38px;height:38px;background:var(--warn);border-bottom-right-radius:22px;display:grid;place-items:center;font-style:normal;font-size:17px;z-index:2}
.tile .badge{position:absolute;top:0;right:0;background:var(--accent);z-index:2;font-size:12px;font-weight:800;padding:5px 12px 6px 14px;border-bottom-left-radius:14px;font-style:normal}
.game p{margin:10px 0 0;font-weight:800;font-size:14px;text-transform:uppercase;line-height:1.2}
.game:active .tile{transform:scale(.97)}
.mini{width:64px;flex:none}.mini .tile{border-radius:18px}.mini .mark{font-size:16px}

/* fields */
.field{display:flex;gap:10px;align-items:center}
.inp{flex:1;min-width:0;background:var(--bg);border:2px solid var(--line);border-radius:16px;color:var(--text);font-size:18px;padding:15px 16px;outline:none;width:100%}
.inp:focus{border-color:var(--pill)}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:17px;border-radius:18px;padding:16px 18px;text-align:center;display:block;width:100%}
.btn.sm{width:auto;padding:15px 20px;font-size:16px}
.btn:disabled,.btn.off{opacity:.4;pointer-events:none}
.btn.green{background:linear-gradient(135deg,#059669,#047857)}
.hint{font-size:13px;margin:8px 4px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}
.sticky{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin-top:18px}
.sticky .btn.off{background:var(--card2);color:var(--muted);opacity:1;border:1px solid var(--line)}

/* regions, items */
.regions{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.reg{position:relative;flex:none;width:92px;padding:14px 0 12px;border-radius:18px;background:var(--card2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--muted)}
.reg i{font-style:normal;font-size:26px}
.reg.on{border-color:var(--accent);background:var(--sel);color:var(--pill)}
.reg.on::after{content:"✓";position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;display:grid;place-items:center}
.items{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left}
.item .ic{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:24px;flex:none}
.item b{display:block;font-size:16px;line-height:1.2}
.item .pr{color:var(--pill);font-weight:800;font-size:15px;white-space:nowrap;display:block}.item s{color:var(--muted);font-size:12px;margin-right:6px;font-weight:600}
.item.on{border-color:var(--pill);background:var(--sel)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);line-height:1.5}
.empty .ico{width:84px;height:84px;border-radius:50%;background:var(--card);margin:0 auto 16px;display:grid;place-items:center;font-size:36px}
.empty b{display:block;color:var(--text);font-size:20px;margin-bottom:6px}

/* history */
.oi{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:20px;padding:12px 14px;margin-bottom:10px}
.oi .ic{width:48px;height:48px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:24px;flex:none}
.oi b{font-size:16px;display:block}.oi small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.oi .r{text-align:right;flex:none}.oi .r b{font-size:16px}
.pill{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;border:1px solid}
.pill.done{color:var(--ok);border-color:#1f6f55;background:rgba(52,211,153,.1)}
.pill.pending{color:var(--warn);border-color:#7a5a12;background:rgba(245,158,11,.1)}
.pill.canceled{color:var(--bad);border-color:#7a2a35;background:rgba(255,93,108,.1)}
.plus{color:var(--ok)}.minus{color:var(--text)}

/* topup */
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.preset{padding:18px 6px;border-radius:18px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:17px}
.preset.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.method{width:100%;display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;text-align:left}
.logo{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff;flex:none;background:linear-gradient(135deg,#4f46e5,#9333ea)}
.method b{font-size:19px;display:block}.method small{color:var(--muted);font-size:14px;display:block;margin:2px 0}.method .pr{color:var(--pill);font-weight:800}
.link{color:var(--pill);font-weight:700;margin:6px 2px 8px;display:block}
.pay{text-align:center}
.pay .big{font-size:44px;font-weight:800}.pay .big span{font-size:20px;color:var(--pill);margin-left:4px}
.copybox{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:14px}
.copybox small{color:var(--muted);font-weight:800;font-size:12px;display:block}.copybox b{font-size:21px;display:block;margin:4px 0;word-break:break-all}
.copybox .cp{width:44px;height:44px;border-radius:50%;background:var(--sel);display:grid;place-items:center;flex:none;font-size:18px}
.drop{border:2px dashed var(--line);border-radius:18px;padding:26px 12px;text-align:center;color:var(--muted);margin-top:10px;cursor:pointer}
.drop .ico{font-size:34px}.drop img{max-width:100%;max-height:220px;border-radius:12px}

/* profile */
.pcard{display:flex;gap:16px;align-items:center}
.pcard .avatar{width:84px;height:84px;font-size:32px;border:3px solid var(--accent2)}
.pcard b{font-size:24px;display:block}.pcard .id{display:inline-block;margin-top:6px;background:var(--card2);color:var(--muted);font-size:14px;font-weight:700;padding:6px 12px;border-radius:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px}
.stat small{color:var(--muted);font-weight:800;font-size:12px}.stat b{font-size:28px;display:block;margin-top:4px}.stat span{font-size:14px;color:var(--muted);font-weight:700}
.stat.o b{color:var(--warn)}
.list .li{display:flex;align-items:center;gap:14px;padding:14px 6px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list .li:last-child{border:0}
.li .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--card2)}
.li b{font-size:17px}.li .chev{color:var(--muted);font-size:22px}
.sw{width:54px;height:32px;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)}.sw.on::after{left:25px}
.seg.mini2{margin:0;padding:4px}.seg.mini2 button{padding:9px 14px;font-size:14px}

/* nav, sheet, toast */
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;background:var(--nav);border:1px solid var(--line);border-radius:999px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);z-index:40}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;border-radius:999px;color:var(--muted);font-size:14px;font-weight:700}
nav button.on{background:var(--sel);color:var(--pill)}
nav svg{width:28px;height:28px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:22px 16px calc(24px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-bottom:0;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(36px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:0 0 14px;font-size:22px}
.sum{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px}
.sum span{color:var(--muted)}.sum b{text-align:right}
.big-ico{font-size:56px;text-align:center;margin:6px 0}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2a2a3c;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:99;max-width:88%;text-align:center}
</style>
</head>

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(text) {
  const d = document.createElement("div"); d.className = "toast"; d.textContent = text;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2600);
}
function copyText(text) {
  const done = () => toast(t("copied"));
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() { const a = document.createElement("textarea"); a.value = text; document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); } catch (e) {} a.remove(); done(); }
}
function applyTheme() {
  const dark = S.me ? S.me.dark : true;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  try { tg.setHeaderColor(dark ? "#080812" : "#f3f3fa"); tg.setBackgroundColor(dark ? "#080812" : "#f3f3fa"); } catch (e) {}
}
function tgLink(url) { tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, "_blank"); }

async function api(path, o = {}) {
  const headers = { Authorization: "tma " + tg.initData };
  let body;
  if (o.form) body = o.form;
  else if (o.json) { headers["Content-Type"] = "application/json"; body = JSON.stringify(o.json); }
  const r = await fetch(path, { method: body ? "POST" : "GET", headers, body });
  let data = {}; try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const er = new Error(data.error || "server"); er.code = data.error || "server"; throw er; }
  return data;
}
const errMsg = e => t("e_" + (e.code || "server")) === "e_" + (e.code || "server") ? t("e_server") : t("e_" + e.code);

function onEnter() {
  if (S.view === "game") { const g = game(S.params.id); S.g = { id: g.id, pid: "", zone: "", idOk: false, region: g.regions[0] ? g.regions[0].id : "",
      catId: g.categories[0].id, item: null, promo: "", pct: null }; }
  if (S.view === "topup") S.tp = { step: 1, amount: S.params.amount || 10, custom: "", method: null, file: null, busy: false };
  if (S.view === "history") loadHist();
}
function go(view, params = {}) { S.stack.push({ view: S.view, params: S.params }); S.view = view; S.params = params; onEnter(); render(); scrollTo(0, 0); }
function root(view) { S.stack = []; S.view = view; S.params = {}; S.sheet = null; onEnter(); render(); scrollTo(0, 0); }
function back() {
  if (S.sheet) { closeSheet(); return; }
  if (S.view === "topup" && S.tp.step > 1) { S.tp.step--; render(); return; }
  const p = S.stack.pop(); if (p) { S.view = p.view; S.params = p.params; render(); scrollTo(0, 0); }
}
if (tg) tg.BackButton.onClick(back);

function tileHTML(g, full) {
  const bg = `linear-gradient(145deg,${g.colors[0]},${g.colors[1]})`;

  return `<div class="tile" style="background:${bg}">${mark}${full ? `<i class="star">★</i><i class="badge">${esc(g.badge)}</i>` : ""}</div>`;
}

  } else if (sh.type === "success") {
    body = `<div class="big-ico">✅</div><h2 style="text-align:center">${t("orderOk")}</h2><p class="muted" style="text-align:center;line-height:1.5">${t("orderOkSub", { id: sh.id })}</p>
      <button class="btn" data-act="toHistory">${t("toHistory")}</button><button class="link" style="text-align:center;width:100%;margin-top:10px" data-act="closeSheet">${t("close")}</button>`;
  } else if (sh.type === "invite") {
    body = `<h2>${t("invite")}</h2><p class="muted" style="line-height:1.5">${t("inviteSub", { p: S.cat.cfg.ref_percent })}</p>
      <div class="copybox"><div class="grow"><b style="font-size:15px">${esc(S.me.ref_link)}</b></div></div>
      <div style="display:grid;gap:10px;margin-top:16px"><button class="btn" data-act="copy" data-t="${esc(S.me.ref_link)}">${t("copyLink")}</button><button class="btn" data-act="share">${t("share")}</button></div>`;
  }
  return `<div class="overlay" data-act="overlay"><div class="sheet">${body}</div></div>`;
}
function closeSheet() { S.sheet = null; render(); }

function render() {
  if (!S.me) return;
  S.lang = S.me.lang;
  document.documentElement.lang = S.lang === "ru" ? "ru" : "tg";
  $app.innerHTML = VIEWS[S.view]();
  const isRoot = ROOT.includes(S.view);
  $nav.hidden = !isRoot;
  if (isRoot) $nav.innerHTML = [["menu", "grid", "menu"], ["history", "hist", "history"], ["profile", "user", "settings"]]
    .map(([v, ic, lb]) => `<button class="${S.view === v ? "on" : ""}" data-act="nav" data-v="${v}">${SVG[ic]}${t(lb)}</button>`).join("");
  $sheet.innerHTML = sheetHTML();
  try { (S.stack.length || S.sheet) ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}

/* ============================ Ma'lumot yuklash ============================ */
async function loadHist() {
  const H = S.hist; H.loading = true;
  try {
    if (H.tab === "orders") H.orders = await api("/api/orders" + (H.filter === "all" ? "" : "?status=" + H.filter));
    else H.tx = await api("/api/tx");
  } catch (e) { toast(errMsg(e)); }
  H.loading = false; if (S.view === "history") render();
}
async function refreshMe() { S.me = await api("/api/me"); }

/* ============================ Tugmalar ============================ */
const ACT = {
  nav: d => { S.hist.orders = null; S.hist.tx = null; root(d.v); },
  mtab: d => { S.menuTab = d.v; render(); },
  bonus: () => { S.menuTab = "gift"; render(); scrollTo(0, 400); },
  support: () => tgLink("https://t.me/" + S.cat.cfg.support),
  reviews: () => tgLink(S.cat.cfg.reviews),
  openGame: d => go("game", { id: d.id }),
  region: d => { S.g.region = d.id; render(); },
  cat: d => { S.g.catId = d.id; S.g.item = null; render(); },
  item: d => { S.g.item = d.id; render(); },
  checkId: () => { const G = S.g; G.idOk = /^\d{4,15}$/.test(G.pid); if (!G.idOk) toast(t("idBad")); render(); },
  applyPromo: async () => {
    const code = S.g.promo.trim(); if (!code) return;
    try { const r = await api("/api/promo", { json: { code } }); S.g.pct = r.percent; } catch (e) { S.g.pct = null; toast(errMsg(e)); }
    render();
  },
  buy: () => {
    const G = S.g, g = game(G.id);
    if (!curItem()) return toast(t("noItem"));
    if (!/^\d{4,15}$/.test(G.pid)) return toast(t("idBad"));
    if (g.need_zone && !/^\d{2,6}$/.test(G.zone)) return toast(t("e_zone"));
    S.sheet = { type: "confirm" }; render();
  },
  confirmBuy: async () => {
    if (S.busy) return; S.busy = true; render();
    const G = S.g;
    try {
      const r = await api("/api/order", { json: { game: G.id, item: G.item, player_id: G.pid, zone: G.zone, region: G.region, promo: G.pct ? G.promo : "" } });
      S.me.balance = r.balance; S.sheet = { type: "success", id: r.order_id }; G.item = null; G.pct = null; G.promo = "";
      S.hist.orders = null; S.hist.tx = null;
    } catch (e) { toast(errMsg(e)); if (e.code === "promo") { S.g.pct = null; S.sheet = null; } }
    S.busy = false; render();
  },
  closeSheet: () => closeSheet(),
  overlay: (d, el, e) => { if (e.target === el) closeSheet(); },
  toHistory: () => { S.sheet = null; S.hist.tab = "orders"; S.hist.filter = "all"; root("history"); },
  topupFromSheet: d => { S.sheet = null; go("topup", { amount: Math.max(+d.n, S.cat.cfg.min) }); },
  goTopup: () => go("topup"),
  preset: d => { S.tp.amount = +d.v; S.tp.custom = ""; render(); },
  amountNext: () => {
    const c = S.cat.cfg, a = S.tp.amount;
    if (!(a >= c.min && a <= c.max)) return toast(t("range", { min: c.min, max: c.max }));
    S.tp.step = 2; render(); scrollTo(0, 0);
  },
  tpStep: d => { S.tp.step = +d.v; render(); },
  method: d => { S.tp.method = d.id; S.tp.step = 3; render(); scrollTo(0, 0); },
  pickFile: () => document.getElementById("tpfile").click(),
  sendTopup: async () => {
    const T = S.tp; if (T.busy) return;
    if (!T.file) return toast(t("noPhoto"));
    T.busy = true; render();
    const f = new FormData(); f.append("method", T.method); f.append("amount", T.amount); f.append("file", T.file);
    try { await api("/api/topup", { form: f }); toast(t("topupSent")); S.hist.tab = "finance"; S.hist.tx = null; root("history"); }
    catch (e) { toast(errMsg(e)); T.busy = false; render(); }
  },
  htab: d => { S.hist.tab = d.v; loadHist(); render(); },
  hfilter: d => { S.hist.filter = d.v; S.hist.orders = null; render(); loadHist(); },
  refresh: () => { S.hist.orders = null; S.hist.tx = null; render(); loadHist(); refreshMe(); },
  lang: async d => { S.me.lang = d.v; render(); try { await api("/api/settings", { json: { lang: d.v } }); } catch (e) {} },
  toggle: async d => {
    const k = d.v; S.me[k] = !S.me[k]; if (k === "dark") applyTheme(); render();
    try { await api("/api/settings", { json: { [k]: S.me[k] } }); } catch (e) {}
  },
  invite: () => { S.sheet = { type: "invite" }; render(); },
  share: () => tgLink("https://t.me/share/url?url=" + encodeURIComponent(S.me.ref_link) + "&text=" + encodeURIComponent(t("shareText"))),
  copy: d => copyText(d.t),
  redeem: async () => {
    const code = S.gift.trim(); if (!code) return;
    try { const r = await api("/api/redeem", { json: { code } }); S.me.balance = r.balance; S.gift = ""; toast("+" + r.amount + " " + t("somoni")); }
    catch (e) { toast(errMsg(e)); }
    render();
  },
  retry: () => boot()
};
const BIND = {
  pid: el => { el.value = el.value.replace(/\D/g, "").slice(0, 15); S.g.pid = el.value; S.g.idOk = false; },
  zone: el => { el.value = el.value.replace(/\D/g, "").slice(0, 6); S.g.zone = el.value; },
  promo: el => { S.g.promo = el.value; S.g.pct = null; },
  gift: el => { S.gift = el.value; },
  custom: el => { el.value = el.value.replace(/\D/g, "").slice(0, 5); S.tp.custom = el.value; S.tp.amount = +el.value || 0;
    document.querySelectorAll(".preset.on").forEach(x => x.classList.remove("on")); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener("input", e => { const b = e.target.dataset && e.target.dataset.bind; if (b && BIND[b]) BIND[b](e.target); });
document.getElementById("tpfile").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  if (!/^image\/(jpeg|png)$/.test(f.type)) return toast(t("e_file"));
  if (f.size > 5 * 1024 * 1024) return toast(t("e_too_big"));
  S.tp.file = f; S.tp.preview = URL.createObjectURL(f); render();
});

/* ============================ Start ============================ */
async function boot() {
  if (!tg || !tg.initData) { $app.innerHTML = `<div class="empty" style="padding-top:120px"><div class="ico">🤖</div><b>${I.tj.openBot}</b>${I.ru.openBot}</div>`; return; }
  tg.ready(); tg.expand();
  try {
    const [cat, me] = await Promise.all([api("/api/catalog"), api("/api/me")]);
    S.cat = cat; S.me = me; applyTheme(); render();
  } catch (e) {
    $app.innerHTML = `<div class="empty" style="padding-top:120px"><div class="ico">⚠️</div><b>${I.tj.e_server}</b><button class="btn" style="margin-top:16px" data-act="retry">${I.tj.retry} / ${I.ru.retry}</button></div>`;
  }
}
boot();
</script>
</body>
</html>
